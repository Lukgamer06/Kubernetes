apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prestashop-data
  namespace: prestashop
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: managed-csi
  resources:
    requests:
      storage: 8Gi
