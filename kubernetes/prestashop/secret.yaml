apiVersion: v1
kind: Secret
metadata:
  name: prestashop-credentials
  namespace: prestashop
type: Opaque
stringData:
  mariadb-root-password: "${PRESTASHOP_DB_ROOT_PASSWORD}"
  mariadb-user: "${PRESTASHOP_DB_USER}"
  mariadb-password: "${PRESTASHOP_DB_PASSWORD}"
  mariadb-database: "${PRESTASHOP_DB_NAME}"
  prestashop-admin-email: "${PRESTASHOP_ADMIN_EMAIL}"
  prestashop-admin-password: "${PRESTASHOP_ADMIN_PASSWORD}"
  prestashop-domain: "${PRESTASHOP_DOMAIN}"
