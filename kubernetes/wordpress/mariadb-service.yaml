apiVersion: v1
kind: Service
metadata:
  name: mariadb
  namespace: wordpress
  labels:
    app.kubernetes.io/name: mariadb
    app.kubernetes.io/instance: wordpress
    app.kubernetes.io/part-of: lab6-multiplatform
spec:
  type: ClusterIP
  selector:
    app: mariadb
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
      protocol: TCP
