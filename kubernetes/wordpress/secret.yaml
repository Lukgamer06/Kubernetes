apiVersion: v1
kind: Secret
metadata:
  name: wordpress-credentials
  namespace: wordpress
type: Opaque
stringData:
  mariadb-root-password: "${WORDPRESS_DB_ROOT_PASSWORD}"
  mariadb-user: "${WORDPRESS_DB_USER}"
  mariadb-password: "${WORDPRESS_DB_PASSWORD}"
  mariadb-database: "${WORDPRESS_DB_NAME}"
  wordpress-admin-user: "${WORDPRESS_ADMIN_USER}"
  wordpress-admin-password: "${WORDPRESS_ADMIN_PASSWORD}"
  wordpress-admin-email: "${WORDPRESS_ADMIN_EMAIL}"
